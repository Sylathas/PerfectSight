<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERFECT SIGHT ADMIN</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0e0e0e;
            color: #ddd;
            margin: 0;
            padding: 30px 40px;
        }

        h1 {
            font-size: 22px;
            letter-spacing: 4px;
            color: #fff;
            margin-bottom: 30px;
        }

        h2 {
            font-size: 13px;
            letter-spacing: 3px;
            color: #888;
            margin: 0;
            text-transform: uppercase;
        }

        a {
            color: #888;
        }

        label {
            display: block;
            font-size: 11px;
            letter-spacing: 2px;
            color: #666;
            margin-top: 14px;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"],
        textarea {
            width: 100%;
            background: #1a1a1a;
            color: #ddd;
            border: 1px solid #333;
            padding: 8px 10px;
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        input[type="password"]:focus,
        textarea:focus {
            border-color: #666;
        }

        textarea {
            resize: vertical;
        }

        input[type="file"] {
            color: #888;
            font-size: 12px;
            margin-top: 4px;
        }

        button {
            background: #1a1a1a;
            color: #ccc;
            border: 1px solid #444;
            padding: 8px 18px;
            font-family: inherit;
            font-size: 12px;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }

        button:hover {
            background: #252525;
            border-color: #666;
        }

        button.primary {
            border-color: #3a6;
            color: #5d9;
        }

        button.primary:hover {
            background: #0a2016;
        }

        button.danger {
            border-color: #833;
            color: #c66;
        }

        button.danger:hover {
            background: #1a0808;
        }

        button.small {
            padding: 5px 10px;
            font-size: 11px;
        }

        .section-divider {
            border: none;
            border-top: 1px solid #222;
            margin: 40px 0 20px;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        /* Login */
        #login {
            max-width: 380px;
            margin: 100px auto;
        }

        #login h1 {
            text-align: center;
        }

        #loginButton {
            width: 100%;
            margin-top: 16px;
            padding: 10px;
        }

        /* Releases list */
        #releases-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }

        .release-card {
            background: #151515;
            border: 1px solid #2a2a2a;
            overflow: hidden;
        }

        .release-card-cover {
            width: 100%;
            aspect-ratio: 1;
            object-fit: cover;
            display: block;
            background: #1a1a1a;
        }

        .release-card-body {
            padding: 12px;
        }

        .release-card-name {
            font-size: 12px;
            color: #ddd;
            margin: 0 0 4px;
            line-height: 1.4;
        }

        .release-card-meta {
            font-size: 11px;
            color: #555;
            margin: 0 0 10px;
        }

        .release-card-actions {
            display: flex;
            gap: 8px;
        }

        /* Forms */
        .form-panel {
            background: #151515;
            border: 1px solid #2a2a2a;
            padding: 24px;
            max-width: 680px;
        }

        .array-inputs {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 6px;
        }

        .array-inputs input {
            margin: 0;
        }

        .status-bar {
            font-size: 12px;
            color: #777;
            padding: 8px 10px;
            background: #111;
            border: 1px solid #2a2a2a;
            margin-top: 12px;
        }

        .status-bar.ok {
            color: #5d9;
            border-color: #1a3a26;
        }

        .status-bar.err {
            color: #c66;
            border-color: #3a1a1a;
        }

        #edit-form {
            display: none;
            margin-top: 30px;
            max-width: 680px;
        }

        #edit-cover-preview {
            max-width: 180px;
            margin-top: 8px;
            display: none;
            border: 1px solid #2a2a2a;
        }

        .counter-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .counter-wrap span {
            color: #555;
            font-size: 13px;
        }

        .counter-wrap input {
            width: 80px;
        }
    </style>
</head>

<body>

    <!-- LOGIN -->
    <div id="login">
        <h1>PERFECT SIGHT SHELL</h1>
        <label for="username">Email</label>
        <input type="text" id="username" autocomplete="username">
        <label for="password">Password</label>
        <input type="password" id="password" autocomplete="current-password">
        <button id="loginButton">LOGIN</button>
        <div id="loginError" class="status-bar err" style="display:none;"></div>
    </div>

    <!-- MAIN CMS (hidden until logged in) -->
    <div id="logged" style="display:none;">
        <h1>PERFECT SIGHT SHELL</h1>

        <!-- ── EXISTING RELEASES ── -->
        <div class="section-header">
            <h2>Releases</h2>
        </div>
        <div id="releases-list">
            <p style="color:#555;font-size:12px;">Loading...</p>
        </div>

        <!-- Edit form (shown inline when Edit is clicked) -->
        <div id="edit-form">
            <hr class="section-divider" style="margin-top:0;">
            <div class="section-header">
                <h2>Editing: <span id="edit-form-title" style="color:#aaa;"></span></h2>
                <button class="small" id="editCancelButton">✕ Cancel</button>
            </div>
            <div class="form-panel">
                <input type="hidden" id="edit-doc-id">
                <label>Name</label>
                <input type="text" id="edit-name">
                <label>Bandcamp Link</label>
                <input type="text" id="edit-bandcamp">
                <label>Description</label>
                <textarea rows="5" id="edit-desc"></textarea>
                <label>Counter</label>
                <div class="counter-wrap"><span>PS</span><input type="text" id="edit-counter"></div>
                <label>Credits (one per field)</label>
                <div class="array-inputs" id="edit-crediti-inputs"></div>
                <button class="small" onclick="addInput('edit-crediti-inputs', 'Credit')">+ Add Credit</button>
                <label>Instagram Handles (without @)</label>
                <div class="array-inputs" id="edit-handles-inputs"></div>
                <button class="small" onclick="addInput('edit-handles-inputs', 'handle')">+ Add Handle</button>
                <label>Cover Image <span style="color:#444;">(leave empty to keep current)</span></label>
                <input type="file" id="edit-cover" accept="image/*">
                <img id="edit-cover-preview" src="" alt="current cover">
                <div style="display:flex;gap:10px;margin-top:20px;">
                    <button class="primary" id="editSaveButton">Save Changes</button>
                    <button id="editCancelButton2">Cancel</button>
                </div>
                <div id="editStatus" class="status-bar" style="display:none;"></div>
            </div>
        </div>

        <!-- ── ADD NEW RELEASE ── -->
        <hr class="section-divider">
        <div class="section-header">
            <h2>Add New Release</h2>
        </div>
        <div class="form-panel">
            <label>Name</label>
            <input type="text" id="name">
            <label>Bandcamp Link</label>
            <input type="text" id="bandcamp">
            <label>Description</label>
            <textarea rows="5" id="desc"></textarea>
            <label>Counter</label>
            <div class="counter-wrap"><span>PS</span><input type="text" id="counter"></div>
            <label>Credits (one per field)</label>
            <div class="array-inputs" id="crediti-inputs">
                <input type="text" placeholder="e.g. Cover ³Christian Kondic">
                <input type="text" placeholder="e.g. Mixed by ¹Palazzi D'Oriente">
            </div>
            <button class="small" onclick="addInput('crediti-inputs', 'Credit')">+ Add Credit</button>
            <label>Instagram Handles (without @)</label>
            <div class="array-inputs" id="handles-inputs">
                <input type="text" placeholder="e.g. palazzidoriente">
                <input type="text" placeholder="e.g. michaelmills__">
            </div>
            <button class="small" onclick="addInput('handles-inputs', 'handle')">+ Add Handle</button>
            <label>Cover Image</label>
            <input type="file" id="cover" accept="image/*">
            <div style="margin-top:20px;">
                <button class="primary" id="uploadButton">Upload Release</button>
            </div>
            <div id="uploadState" class="status-bar" style="display:none;"></div>
        </div>
    </div>

    <!-- Utility JS (non-module, so onclick attributes work) -->
    <script>
        function addInput(containerId, placeholder) {
            const div = document.getElementById(containerId);
            const input = document.createElement('input');
            input.type = 'text';
            input.placeholder = placeholder + ' ' + (div.children.length + 1);
            div.appendChild(input);
        }

        function getArrayValues(containerId) {
            return Array.from(document.getElementById(containerId).querySelectorAll('input'))
                .map(i => i.value.trim())
                .filter(v => v !== '');
        }

        function setStatus(id, msg, type) {
            const el = document.getElementById(id);
            el.textContent = msg;
            el.className = 'status-bar' + (type ? ' ' + type : '');
            el.style.display = 'block';
        }
    </script>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js';
        import {
            getFirestore, collection, doc,
            getDoc, setDoc, deleteDoc, onSnapshot
        } from 'https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js';
        import {
            getStorage, ref as storageRef,
            uploadBytesResumable, getDownloadURL
        } from 'https://www.gstatic.com/firebasejs/10.0.0/firebase-storage.js';
        import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyAzRT24VVIc4l0xrVcO_QLgueFihoAKIGE",
            authDomain: "perfect-sight-36dd1.firebaseapp.com",
            projectId: "perfect-sight-36dd1",
            storageBucket: "perfect-sight-36dd1.firebasestorage.app",
            messagingSenderId: "672235729116",
            appId: "1:672235729116:web:2520ea4eb2bdb50b9d0419"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const storage = getStorage(app);

        // ── LOGIN ──────────────────────────────────────────────────────────
        document.getElementById("loginButton").onclick = function () {
            const email = document.getElementById("username").value;
            const pass = document.getElementById("password").value;
            document.getElementById("loginError").style.display = "none";
            signInWithEmailAndPassword(auth, email, pass)
                .then(() => {
                    document.getElementById("login").style.display = "none";
                    document.getElementById("logged").style.display = "block";
                    startListening();
                })
                .catch((err) => {
                    const el = document.getElementById("loginError");
                    el.textContent = err.message;
                    el.style.display = "block";
                });
        };

        // ── LIVE RELEASES LIST ─────────────────────────────────────────────
        function startListening() {
            onSnapshot(collection(db, 'release'), (snapshot) => {
                const list = document.getElementById('releases-list');
                list.innerHTML = '';
                if (snapshot.empty) {
                    list.innerHTML = '<p style="color:#555;font-size:12px;">No releases found.</p>';
                    return;
                }
                const docs = [];
                snapshot.forEach(d => docs.push({ id: d.id, ...d.data() }));
                docs.sort((a, b) => (b.counter || '').localeCompare(a.counter || ''));

                docs.forEach(data => {
                    const card = document.createElement('div');
                    card.className = 'release-card';
                    card.innerHTML = `
                        <img class="release-card-cover" src="${data.cover || ''}" alt="${data.id}" onerror="this.style.background='#1a1a1a';this.style.minHeight='200px';">
                        <div class="release-card-body">
                            <p class="release-card-name">${data.name || data.id}</p>
                            <p class="release-card-meta">PS${data.counter || '—'} &nbsp;·&nbsp; <a href="${data.bandcamp || '#'}" target="_blank">Bandcamp ↗</a></p>
                            <div class="release-card-actions">
                                <button class="small" data-edit="${data.id}">Edit</button>
                                <button class="small danger" data-delete="${data.id}">Delete</button>
                            </div>
                        </div>
                    `;
                    card.querySelector('[data-edit]').addEventListener('click', () => openEdit(data.id));
                    card.querySelector('[data-delete]').addEventListener('click', () => deleteRelease(data.id));
                    list.appendChild(card);
                });
            });
        }

        // ── DELETE ─────────────────────────────────────────────────────────
        async function deleteRelease(id) {
            if (!confirm(`Delete "${id}"?\n\nThis cannot be undone.`)) return;
            await deleteDoc(doc(db, 'release', id));
        }

        // ── OPEN EDIT FORM ─────────────────────────────────────────────────
        async function openEdit(id) {
            const snap = await getDoc(doc(db, 'release', id));
            if (!snap.exists()) { alert('Release not found.'); return; }
            const data = snap.data();

            document.getElementById('edit-doc-id').value = id;
            document.getElementById('edit-form-title').textContent = id;
            document.getElementById('edit-name').value = data.name || '';
            document.getElementById('edit-bandcamp').value = data.bandcamp || '';
            document.getElementById('edit-desc').value = data.desc || '';
            document.getElementById('edit-counter').value = data.counter || '';

            const creditiDiv = document.getElementById('edit-crediti-inputs');
            creditiDiv.innerHTML = '';
            (data.crediti || []).forEach(c => {
                const inp = document.createElement('input');
                inp.type = 'text'; inp.value = c;
                creditiDiv.appendChild(inp);
            });

            const handlesDiv = document.getElementById('edit-handles-inputs');
            handlesDiv.innerHTML = '';
            (data.handles || []).forEach(h => {
                const inp = document.createElement('input');
                inp.type = 'text'; inp.value = h;
                handlesDiv.appendChild(inp);
            });

            const preview = document.getElementById('edit-cover-preview');
            if (data.cover) { preview.src = data.cover; preview.style.display = 'block'; }
            else { preview.style.display = 'none'; }

            document.getElementById('edit-cover').value = '';
            document.getElementById('editStatus').style.display = 'none';
            document.getElementById('edit-form').style.display = 'block';
            document.getElementById('edit-form').scrollIntoView({ behavior: 'smooth' });
        }

        // ── CANCEL EDIT ────────────────────────────────────────────────────
        document.getElementById('editCancelButton').onclick =
            document.getElementById('editCancelButton2').onclick = function () {
                document.getElementById('edit-form').style.display = 'none';
            };

        // ── SAVE EDIT ──────────────────────────────────────────────────────
        document.getElementById('editSaveButton').onclick = async function () {
            const id = document.getElementById('edit-doc-id').value;
            const name = document.getElementById('edit-name').value.trim();
            const bandcamp = document.getElementById('edit-bandcamp').value.trim();
            const desc = document.getElementById('edit-desc').value.trim();
            const counter = document.getElementById('edit-counter').value.trim();
            const crediti = getArrayValues('edit-crediti-inputs');
            const handles = getArrayValues('edit-handles-inputs');
            const coverFile = document.getElementById('edit-cover').files[0];

            setStatus('editStatus', 'Saving…');

            const persist = async (coverURL) => {
                const payload = { name, bandcamp, desc, counter, crediti, handles };
                if (coverURL) payload.cover = coverURL;
                await setDoc(doc(db, 'release', id), payload, { merge: true });
                setStatus('editStatus', 'Saved!', 'ok');
                document.getElementById('edit-form').style.display = 'none';
            };

            if (coverFile) {
                const ref = storageRef(storage, name);
                const task = uploadBytesResumable(ref, coverFile);
                task.on('state_changed',
                    (snap) => setStatus('editStatus', `Uploading cover: ${Math.round(snap.bytesTransferred / snap.totalBytes * 100)}%`),
                    (err) => setStatus('editStatus', 'Upload failed: ' + err.message, 'err'),
                    () => getDownloadURL(task.snapshot.ref).then(url => persist(url))
                );
            } else {
                await persist(null);
            }
        };

        // ── ADD NEW RELEASE ────────────────────────────────────────────────
        document.getElementById('uploadButton').onclick = function () {
            const name = document.getElementById('name').value.trim();
            const bandcamp = document.getElementById('bandcamp').value.trim();
            const desc = document.getElementById('desc').value.trim();
            const counter = document.getElementById('counter').value.trim();
            const coverFiles = document.getElementById('cover').files;
            const crediti = getArrayValues('crediti-inputs');
            const handles = getArrayValues('handles-inputs');

            if (!name || !desc || !bandcamp || !crediti.length || !handles.length || !coverFiles.length) {
                setStatus('uploadState', 'Error: please fill in all fields and select a cover image.', 'err');
                return;
            }

            setStatus('uploadState', 'Uploading cover…');
            const ref = storageRef(storage, name);
            const task = uploadBytesResumable(ref, coverFiles[0]);
            task.on('state_changed',
                (snap) => {
                    const pct = Math.round(snap.bytesTransferred / snap.totalBytes * 100);
                    setStatus('uploadState', `Uploading: ${pct}% — do not close this window.`);
                },
                (err) => setStatus('uploadState', 'Upload failed: ' + err.message, 'err'),
                () => {
                    getDownloadURL(task.snapshot.ref).then((downloadURL) => {
                        setDoc(doc(db, 'release', name), {
                            name, bandcamp, crediti, handles, desc, counter, cover: downloadURL
                        }).then(() => {
                            setStatus('uploadState', 'Release uploaded successfully!', 'ok');
                            // Clear the form
                            ['name', 'bandcamp', 'desc', 'counter'].forEach(id => document.getElementById(id).value = '');
                            document.getElementById('cover').value = '';
                            document.getElementById('crediti-inputs').innerHTML = '<input type="text" placeholder="e.g. Cover ³Christian Kondic"><input type="text" placeholder="e.g. Mixed by ¹Palazzi D\'Oriente">';
                            document.getElementById('handles-inputs').innerHTML = '<input type="text" placeholder="e.g. palazzidoriente"><input type="text" placeholder="e.g. michaelmills__">';
                        });
                    });
                }
            );
        };
    </script>
</body>

</html>
