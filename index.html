<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>PERFECT SIGHT</title>
    <link rel="shortcut icon" type="image/png" href="./assets/Favicon.png" />
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="https://unpkg.com/jquery-scrollify@1.0.21/jquery.scrollify.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery.scrollto@2.1.3/jquery.scrollTo.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="start">
        <div id="startLogo">
            <video autoplay muted playsinline id="loading">
                <source src="./assets/Loading.mp4" type="video/mp4">
            </video>
        </div>
    </div>
    <div id="navbar">
        <div class='logo navElement'></div>
        <div class="navElement">
            <p id="layout">GRID</p>
        </div>
        <div class='logoMobile navElementTwo'></div>
        <div class="navElement">
            <p id="contactPage">CONTACTS</p>
        </div>
        <div class="navElement" id="blank">
            <p></p>
        </div>
    </div>
    <div id="releaseGrid">
        <div id="4g" class="gridBlock" style="background-image: url('./assets/Cover4.jpg')"></div>
        <div id="3g" class="gridBlock" style="background-image: url('./assets/Cover3.jpg')"></div>
        <div id="2g" class="gridBlock" style="background-image: url('./assets/Cover2.jpeg')"></div>
        <div id="1g" class="gridBlock" style="background-image: url('./assets/Cover.jpeg')"></div>
    </div>
    <div id="open"></div>
    <div id="grid">
        <p id="void">Select a release from the grid to see it here.</p>
    </div>
    <div id="contacts">
        <p style="font-size: 50px; font-weight: bold;"><img id='monogram' src="./assets/Monogram.png">
        </p>
        <p>Digital distribution and music catalogue: exploring intuitions in the realm of
            inaccuracy since '23.</p>
        <p><a href="mailto: info@perfectsight.org">perfectsight.ps@gmail.com</a></p>
        <p id="devCredits">Development & Design: <a href="https://www.instagram.com/covo.world/">Covo </a>(<a
                href="https://www.instagram.com/sylathas/">Sylathas</a>, <a
                href="https://www.instagram.com/chaoticgoodpersona">Fenice</a>)
        </p>
    </div>
    <script src="script.js" type="module"></script>
</body>

</html>
